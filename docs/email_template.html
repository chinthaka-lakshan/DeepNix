<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; background-color: #0a0f1c; font-family: Arial, sans-serif;">
    <div
        style="max-width: 600px; margin: 40px auto; background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%); border-radius: 24px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);">

        <!-- Header -->
        <div
            style="background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%); padding: 40px 30px; text-align: center;">
            <h1 style="margin: 0; color: #ffffff; font-size: 32px; font-weight: 700;">DEEPNIX</h1>
            <p
                style="margin: 8px 0 0 0; color: rgba(255, 255, 255, 0.9); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 2px;">
                New Contact Message</p>
        </div>

        <!-- Body -->
        <div style="padding: 35px 30px;">
            <!-- Contact Info Card -->
            <div
                style="background: rgba(255, 255, 255, 0.05); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); padding: 25px; margin-bottom: 20px;">
                <h2
                    style="margin: 0 0 20px 0; color: #3b82f6; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid rgba(59, 130, 246, 0.3); padding-bottom: 10px;">
                    Contact Information</h2>

                <div style="margin-bottom: 15px;">
                    <p
                        style="margin: 0 0 4px 0; color: rgba(255, 255, 255, 0.6); font-size: 11px; font-weight: 600; text-transform: uppercase;">
                        Name</p>
                    <p style="margin: 0; color: #ffffff; font-size: 15px; font-weight: 500;">{{from_name}}</p>
                </div>

                <div style="margin-bottom: 15px;">
                    <p
                        style="margin: 0 0 4px 0; color: rgba(255, 255, 255, 0.6); font-size: 11px; font-weight: 600; text-transform: uppercase;">
                        Email</p>
                    <p style="margin: 0; color: #06b6d4; font-size: 15px; font-weight: 500;">{{from_email}}</p>
                </div>

                <div style="margin-bottom: 15px;">
                    <p
                        style="margin: 0 0 4px 0; color: rgba(255, 255, 255, 0.6); font-size: 11px; font-weight: 600; text-transform: uppercase;">
                        Phone/Company</p>
                    <p style="margin: 0; color: #ffffff; font-size: 15px; font-weight: 500;">{{from_phone}}</p>
                </div>

                <div>
                    <p
                        style="margin: 0 0 4px 0; color: rgba(255, 255, 255, 0.6); font-size: 11px; font-weight: 600; text-transform: uppercase;">
                        Subject</p>
                    <p style="margin: 0; color: #ffffff; font-size: 15px; font-weight: 500;">{{subject}}</p>
                </div>
            </div>

            <!-- Message Card -->
            <div
                style="background: rgba(255, 255, 255, 0.05); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); padding: 25px;">
                <h2
                    style="margin: 0 0 15px 0; color: #06b6d4; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid rgba(6, 182, 212, 0.3); padding-bottom: 10px;">
                    Message</h2>
                <div style="color: rgba(255, 255, 255, 0.9); font-size: 14px; line-height: 1.7; white-space: pre-wrap;">
                    {{message}}</div>
            </div>
        </div>

        <!-- Footer -->
        <div
            style="background: rgba(255, 255, 255, 0.02); padding: 20px 30px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.05);">
            <p style="margin: 0 0 6px 0; color: rgba(255, 255, 255, 0.5); font-size: 12px;">Sent from DEEPNIX Contact
                Form</p>
            <p style="margin: 0; color: rgba(255, 255, 255, 0.4); font-size: 11px;">deepnixcompany@gmail.com</p>
        </div>
    </div>
</body>

</html>
